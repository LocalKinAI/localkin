# KinClaw Auto-Demo Task Pool
# 30 production-ready tasks for daily auto-recorded demo videos
# Generated 2026-04-29 — designed for skill `auto_demo` + cron loop
#
# Schema per task:
#   id:                    unique slug (snake_case)
#   tier:                  1-6 (priority for launch sequencing)
#   title_zh / title_en:   bilingual titles for upload metadata
#   narrative_zh / _en:    shot-by-shot description (the actual recording plan)
#   duration_sec:          target final video length (post-edit)
#   capability_showcased:  list of KinClaw capabilities the demo highlights
#   platforms:             upload targets (matches `platforms:` block below)
#   hook:                  one-line "why this matters" tag for the editor
#
# Tier strategy:
#   Tier 1: Launch week — strongest narrative (5 tasks)
#   Tier 2: LocalKin recursion (8 tasks)
#   Tier 3: Productivity / mass audience (5 tasks)
#   Tier 4: Dev / coder soul (4 tasks)
#   Tier 5: Christian niche (3 tasks)
#   Tier 6: Advanced technical depth (5 tasks)
#
# Editorial calendar at the bottom of this file plans 4 weeks of daily posts.

version: "1.0"
generated: "2026-04-29"
total_tasks: 30

# ─── Generation defaults (auto_demo skill picks these up) ───────────
defaults:
  output_dir: "/Users/jackysun/Documents/Workspace/kinclaw/output/demos"
  resolution: "1920x1080"
  fps: 30
  voiceover_engine_zh: "kokoro_zh"
  voiceover_engine_en: "kokoro_en"
  caption_subtitle: true
  thumbnail_auto: true
  watermark: "© KinClaw · localkin.dev"

# ─── Per-platform upload settings ───────────────────────────────────
platforms:
  youtube:
    enabled: true
    shorts: false
    lang: ["zh", "en"]
  youtube_shorts:
    enabled: true
    lang: ["zh", "en"]
    duration_max: 60
  twitter:
    enabled: true
    lang: ["en", "zh"]
    duration_max: 140
  bilibili:
    enabled: true
    lang: ["zh"]
    duration_max: 600
  douyin:
    enabled: false               # phase 2
    lang: ["zh"]
    duration_max: 60
  xiaohongshu:
    enabled: false               # phase 2
    lang: ["zh"]
    duration_max: 60
  hn:
    enabled: false               # manual review only — never auto-post
    lang: ["en"]
  wechat_video:
    enabled: false               # phase 3 — needs manual login
    lang: ["zh"]
  church_groups:
    enabled: false               # phase 3 — manual share
    lang: ["zh", "en"]

# ─── Cron loop ──────────────────────────────────────────────────────
cron:
  schedule: "0 8 * * *"                  # every day 8am PT
  pick_strategy: "weighted_by_platform_freshness"
  fallback_pick: "round_robin_through_tiers"
  max_per_day: 1                         # never spam — one quality demo / day

# ════════════════════════════════════════════════════════════════════
# TASKS POOL (30 entries)
# ════════════════════════════════════════════════════════════════════

